<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>A Letter for Riya</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    background: linear-gradient(160deg, #ffe3ec, #ffd1dc 50%, #ffe9d6);
    font-family: 'Dancing Script', cursive;
  }
  body { display: flex; justify-content: center; align-items: center; }

  /* ---------- Envelope ---------- */
  .envelope-container {
    position: relative; cursor: pointer;
    width: min(86vw, 380px); aspect-ratio: 4 / 3;
  }
  .envelope-back {
    position: absolute; inset: 0; z-index: 0; border-radius: 8px;
    background: #f2a3b6; box-shadow: 0 18px 40px rgba(194, 24, 91, .25);
  }
  .envelope-front {
    position: absolute; inset: 0; z-index: 3; border-radius: 8px;
    background: linear-gradient(180deg, #f8b9c8, #f4a6b7);
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    pointer-events: none;
  }
  .flap {
    position: absolute; top: 0; left: 0; width: 100%; height: 55%;
    z-index: 4; transform-origin: top center;
    background: linear-gradient(180deg, #ee8fa6, #f39ab0);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transition: transform .6s ease, z-index 0s .3s;
    pointer-events: none;
  }
  .seal {
    position: absolute; left: 50%; top: 55%; z-index: 6;
    width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff5d7e, #c2185b 70%);
    box-shadow: 0 3px 8px rgba(0,0,0,.3);
    display: flex; align-items: center; justify-content: center;
    color: #ffe3ec; font-size: 20px; line-height: 1; pointer-events: none;
  }
  .seal.broken { animation: sealBreak .45s ease-out forwards; }
  @keyframes sealBreak {
    30%  { transform: scale(1.3) rotate(-10deg); }
    100% { transform: translateY(26px) scale(.2) rotate(50deg); opacity: 0; }
  }

  /* Letter */
  .photo-card {
    position: absolute; left: 5%; bottom: 6%; width: 90%; z-index: 2;
    padding: 6px; background: #fff; border-radius: 4px;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
    transition: transform .9s ease, box-shadow .9s ease;
    will-change: transform;
  }
  .photo-card img { display: block; width: 100%; height: auto; aspect-ratio: 1600 / 1196; border-radius: 2px; }

  .envelope-container.open .flap { transform: perspective(800px) rotateX(180deg); z-index: 1; }
  .envelope-container.pull-out .photo-card { transform: translateY(-62%); }
  .envelope-container.read .photo-card {
    transform: translateY(-45%) scale(1.12); z-index: 20;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }

  .shake { animation: shake .5s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px) rotate(-2deg); }
    40%, 80% { transform: translateX(10px) rotate(2deg); }
  }

  .instruction {
    position: absolute; top: calc(100% + 36px); left: 0; width: 100%;
    text-align: center; font-size: 1.6rem; color: #c2185b;
    text-shadow: 1px 1px 3px rgba(255,255,255,.9);
    transition: opacity .5s ease; pointer-events: none;
  }

  /* ---------- Full-screen reader ---------- */
  #reader {
    position: fixed; inset: 0; z-index: 100;
    display: flex; justify-content: center; align-items: center;
    background: rgba(255, 240, 245, .98);
    opacity: 0; visibility: hidden;
    transition: opacity 1s ease, visibility 0s 1s;
  }
  #reader.show { opacity: 1; visibility: visible; transition: opacity 1s ease; }
  #reader img { max-width: 100%; max-height: 100%; object-fit: contain; padding: 10px; }
  #reader.rot img {
    position: absolute; top: 50%; left: 50%;
    width: 100vh; width: 100dvh; height: 100vw; height: 100dvw;
    max-width: none; max-height: none;
    transform: translate(-50%, -50%) rotate(90deg);
  }
  #rotate-btn {
    position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    font: 600 14px system-ui, sans-serif; color: #fff; background: #d81b60;
    border: 0; border-radius: 30px; padding: 10px 16px; cursor: pointer;
    box-shadow: 0 6px 14px rgba(216,27,96,.3);
  }
  @media (orientation: landscape) { #rotate-btn { display: none; } }

  #mute-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 200;
    width: 40px; height: 40px; border-radius: 50%; border: 0; font-size: 18px;
    background: rgba(255,255,255,.7); cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .shake, .seal.broken { animation-duration: .01s; }
  }
</style>
</head>
<body>

<button id="mute-btn" aria-label="Toggle sound">🔊</button>

<div class="envelope-container" id="envelope">
  <div class="instruction" id="instruction">Tap the seal 3 times to open...</div>
  <div class="envelope-back"></div>
  <div class="photo-card" id="photo-card">
    <img src="letter.jpg" alt="Handwritten birthday letter" decoding="async">
  </div>
  <div class="envelope-front"></div>
  <div class="flap"></div>
  <div class="seal" id="seal">❤</div>
</div>

<div id="reader">
  <img src="letter.jpg" alt="Handwritten birthday letter" decoding="async">
  <button id="rotate-btn">↻ Rotate to read bigger</button>
</div>

<script>
(() => {
  /* ======================= AUDIO (synthesised, no files to load) ======================= */
  // Optional: set a URL to use a real track instead of the built-in calm tune
  const MUSIC_URL = '';

  const CH = 7; // seconds per chord: slow and calm
  const CHORDS = [
    [130.81, 164.81, 196.00, 246.94], // Cmaj7
    [110.00, 164.81, 196.00, 261.63], // Am7
    [ 87.31, 130.81, 164.81, 220.00], // Fmaj7
    [ 98.00, 146.83, 196.00, 246.94]  // G(add)
  ];
  const BELLS = [523.25, 587.33, 659.25, 783.99, 880.00]; // C major pentatonic

  let ac, master, conv, musicBus, sfx, noiseBuf, musicEl;
  let muted = false, chordIdx = 0, nextChord = 0, nextBell = 0;

  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    ac = new Ctx();

    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(ac.destination);

    // Soft reverb from a generated impulse response
    const len = Math.floor(ac.sampleRate * 2.8);
    const ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    }
    conv = ac.createConvolver(); conv.buffer = ir;
    const wet = ac.createGain(); wet.gain.value = 0.5;
    conv.connect(wet); wet.connect(master);

    sfx = ac.createGain(); sfx.gain.value = 0.8; sfx.connect(master);

    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    if (MUSIC_URL) {
      musicEl = new Audio(MUSIC_URL); musicEl.loop = true; musicEl.volume = 0.35; musicEl.muted = muted;
      musicEl.play().catch(() => {});
      return;
    }

    musicBus = ac.createGain();
    musicBus.gain.setValueAtTime(0, ac.currentTime);
    musicBus.gain.linearRampToValueAtTime(0.3, ac.currentTime + 4); // gentle fade-in
    musicBus.connect(master); musicBus.connect(conv);

    nextChord = ac.currentTime + 0.1;
    nextBell = ac.currentTime + 3;
    setInterval(schedule, 300);
  }

  function schedule() {
    const now = ac.currentTime;
    while (nextChord < now + 1.5) { playChord(nextChord, CHORDS[chordIdx++ % CHORDS.length]); nextChord += CH; }
    while (nextBell < now + 1.5) {
      if (Math.random() < 0.7) playBell(nextBell, BELLS[(Math.random() * BELLS.length) | 0], musicBus, 0.5);
      nextBell += 1.4 + Math.random() * 1.8;
    }
  }

  function playChord(t, notes) {
    for (const f of notes) for (const det of [-5, 5]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f; o.detune.value = det;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.12, t + 2);
      g.gain.setValueAtTime(0.12, t + CH - 0.5);
      g.gain.linearRampToValueAtTime(0, t + CH + 2);
      o.connect(g); g.connect(musicBus);
      o.start(t); o.stop(t + CH + 2.1);
    }
  }

  function playBell(t, f, bus, vol) {
    for (const [mult, v] of [[1, 1], [2, 0.25]]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f * mult;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol * v, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
      o.connect(g); g.connect(bus);
      if (bus === sfx) g.connect(conv);
      o.start(t); o.stop(t + 2.5);
    }
  }

  /* ---- Sound effects ---- */
  function noise(t, dur, type, f0, f1, vol) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    f.Q.value = type === 'bandpass' ? 1.2 : 0.7;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(0.01, dur / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfx);
    s.start(t); s.stop(t + dur + 0.05);
  }
  function thump(t, f0, f1, dur, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t + dur + 0.02);
  }
  const sfxTap = () => { if (!ac) return; const t = ac.currentTime; noise(t, .07, 'lowpass', 900, 300, .5); thump(t, 140, 70, .08, .4); };
  const sfxBreak = () => {
    if (!ac) return; const t = ac.currentTime;
    noise(t, .12, 'highpass', 2500, 1200, .9);          // wax crack
    thump(t, 170, 45, .2, .8);                          // thud
    for (let i = 0; i < 4; i++) noise(t + .03 + i * .05 + Math.random() * .03, .03, 'highpass', 3500, 3000, .5); // crumbs
  };
  const sfxFlap  = () => { if (ac) noise(ac.currentTime, .4, 'bandpass', 500, 1900, .45); };
  const sfxSlide = () => { if (ac) noise(ac.currentTime, .6, 'bandpass', 1400, 700, .3); };
  const sfxChime = () => { if (!ac) return; const t = ac.currentTime; playBell(t, 880, sfx, .35); playBell(t + .25, 1174.66, sfx, .3); };

  // Save battery: pause audio when the tab is hidden
  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    if (document.hidden) { ac.suspend(); if (musicEl) musicEl.pause(); }
    else { ac.resume(); if (musicEl) musicEl.play().catch(() => {}); }
  });

  const muteBtn = document.getElementById('mute-btn');
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (ac) master.gain.setTargetAtTime(muted ? 0 : 0.9, ac.currentTime, 0.05);
    if (musicEl) musicEl.muted = muted;
  });

  /* ======================= ENVELOPE ======================= */
  const envelope = document.getElementById('envelope');
  const instruction = document.getElementById('instruction');
  const seal = document.getElementById('seal');
  const reader = document.getElementById('reader');
  let isOpened = false, clickCount = 0;

  envelope.addEventListener('animationend', e => {
    if (e.target === envelope) envelope.classList.remove('shake');
  });

  envelope.addEventListener('click', () => {
    if (isOpened) return;
    initAudio();           // must start inside a user tap
    clickCount++;

    if (clickCount < 3) {
      sfxTap();
      envelope.classList.remove('shake');
      void envelope.offsetWidth;
      envelope.classList.add('shake');
      const left = 3 - clickCount;
      instruction.textContent = `Tap ${left} more time${left === 1 ? '' : 's'}...`;
      return;
    }

    isOpened = true;
    instruction.style.opacity = '0';

    sfxBreak();                                   // seal breaks
    seal.classList.add('broken');
    envelope.classList.add('open');               // flap lifts
    setTimeout(sfxFlap, 120);

    setTimeout(() => { envelope.classList.add('pull-out'); sfxSlide(); }, 700);   // letter slides out
    setTimeout(() => envelope.classList.add('read'), 1600);                       // lifts toward you
    setTimeout(() => { reader.classList.add('show'); sfxChime(); }, 3100);        // full screen
  });

  // Phones in portrait: rotate the letter to use the full height
  document.getElementById('rotate-btn').addEventListener('click', e => {
    e.stopPropagation();
    reader.classList.toggle('rot');
  });
})();
</script>
</body>
</html>
